name: ci-bankapp

on:
  push:
    branches: ["main"]
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
     - uses: actions/checkout@v4

     - name: setup java
       uses: actions/setup-java@v4
       with: 
        distribution: 'temurin'
        java-version: '11'
     - name: cache maven dependencies
       uses: actions/cache@v4
       with: 
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml')}}
        restore-keys: |
          ${{runner.os}}-m2
     - name: build app
       run: mvn clean install
     - name: unit test
       run: mvn test

