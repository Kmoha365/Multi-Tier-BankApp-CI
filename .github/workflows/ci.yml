name: ci-bankapp

on:
  push:
    branches: ["main"]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
     - uses: actions/checkout@v4
     - name: secret scan
       uses: zricethezav/gitleaks-action@v2

     - name: setup java
       uses: actions/setup-java@v4
       with: 
        distribution: 'temurin'
        java-version: '17'
        cache: maven
     
     - name: build app
       run: mvn clean install -DskipTests

