name: ci-bankapp

on:
  push:
    branches: ["main"]
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
     - uses: actions/checkout@v4

     - name: setup java
       uses: actions/setup-java@v4
       with: 
        distribution: 'temurin'
        java-version: '17'
        cache: maven
     
     - name: build app
       run: mvn clean install -DskipTests

